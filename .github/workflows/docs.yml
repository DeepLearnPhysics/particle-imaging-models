# =============================================================================
# pimm documentation — build & publish
# =============================================================================
#
# Builds the Sphinx docs on every pull request and publishes pushes to main to
#   https://deeplearnphysics.org/particle-imaging-models/stable/
#
# Native GitHub Pages from Actions on this repo's `github-pages` environment;
# the org's verified domain serves each project's Pages at
# deeplearnphysics.org/<repo-name>/. The site is built into _site/stable/ with a
# root redirect, so the canonical URL is /particle-imaging-models/stable/
# (matching conf.py `html_baseurl`).
#
# `make -C docs html` runs docs/tools/gen_reference.py, which reads the CLI
# parsers, configs and registries, then Sphinx with -W: any warning fails the
# build. The workflow is gated to the canonical public repo.
# =============================================================================

name: Docs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'docs/**'
      - 'pimm/**'
      - 'configs/**'
      - 'launch/**'
      - 'scripts/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'pimm/**'
      - 'configs/**'
      - 'launch/**'
      - 'scripts/**'
      - 'uv.lock'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Least privilege for the native Pages deployment (same set doraemon_site uses).
permissions:
  contents: read
  pages: write
  id-token: write

# GitHub's recommended Pages concurrency: serialize, don't abort an in-flight
# deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # only the canonical public repo publishes, never the private working repo or forks
    if: github.repository == 'DeepLearnPhysics/particle-imaging-models'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # tags + history (autodoc/version niceties)

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.11.28
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked docs environment
        run: uv sync --locked --group docs

      - name: Build the docs
        run: uv run --no-sync make -C docs html

      # Assemble the Pages artifact: site under /stable/, plus a root redirect so
      # /particle-imaging-models/ lands on /particle-imaging-models/stable/.
      - name: Assemble Pages site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site/stable
          cp -r docs/build/html/. _site/stable/
          printf '<!doctype html>\n<meta http-equiv="refresh" content="0; url=stable/">\n<title>pimm docs</title>\n<a href="stable/">pimm documentation</a>\n' > _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.repository == 'DeepLearnPhysics/particle-imaging-models' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
